[pytest]
pythonpath = src
testpaths = unit_tests
# test modules in this project are named <module>_tests.py, not the pytest default test_*.py
python_files = *_tests.py test_*.py
# superseded by aud2cor_split_tests.py; it builds its cases from the oversized .mat
# originals, which are no longer kept, so importing it aborts collection
addopts = --ignore=unit_tests/aud2cor_tests.py
