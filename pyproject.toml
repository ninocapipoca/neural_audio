[build-system]
requires = ["setuptools >= 77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neural_audio"
version = "0.1.0"
authors = [
  { name = "C L Nina Matos" },
]
description = "A library for bio-inspired sound processing."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]

dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
plotting = [
    "matplotlib>=3.7",
]
hdf5 = [
    "h5py>=3.8",
]
docs = [
    "sphinx>=6.0",
    "sphinx-rtd-theme>=1.3",
    "matplotlib>=3.7",
    "h5py>=3.8",
]
tests = [
    "parameterized",
    "soundfile",
    "h5py>=3.8",
]
tutorials = [
    "jupyter",
    "matplotlib>=3.7",
    "ipywidgets",
    "soundfile",
]
build = [
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/ninocapipoca/neural_audio"
Documentation = "https://neural-audio.readthedocs.io/en/latest/"
"Bug Tracker" = "https://github.com/ninocapipoca/neural_audio/issues"

"Homepage" = "https://pypi.org/project/neural_audio/"
[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
neural_audio = [
    "examples/filters/*.npz",
    "examples/sounds/*.wav",
    "examples/sounds/synthetic_sounds/*.wav",
]
